<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#070c1a" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(56, 189, 248, 0.35)" stroke-width="8" />

  <!-- Geometric Layer/Shield Accent -->
  <path d="M256 72 L416 160 L256 248 L96 160 Z" fill="url(#blueGrad)" opacity="0.9" filter="url(#glow)" />
  <path d="M128 210 L256 280 L384 210 L416 228 L256 316 L96 228 Z" fill="#2563eb" opacity="0.75" />
  <path d="M128 278 L256 348 L384 278 L416 296 L256 384 L96 296 Z" fill="#38bdf8" opacity="0.6" />

  <!-- Prominent "RC" Monogram -->
  <text x="256" y="455" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="82" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">RC TECH</text>
  <circle cx="430" cy="435" r="10" fill="#38bdf8" />
</svg>
